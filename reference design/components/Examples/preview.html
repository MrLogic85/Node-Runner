<style id="layout-classes">
.slot-rail{position:absolute;left:0;top:0;bottom:0;width:var(--w-rail)}

.slot-side{position:absolute;right:0;top:0;bottom:0;width:var(--w-side)}
.slot-tray{position:absolute;left:0;right:var(--w-side);bottom:0}
.slot-world{position:absolute;left:0;right:var(--w-side);top:0;bottom:0}.slot-world.wide,.slot-tray.wide{right:28px}   /* Training: the arena, with the Status panel open or collapsed to its 28 tab */
.slot-fill{position:absolute;left:0;right:0;top:0;bottom:0}
.slot-foot{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-1)}
.slot-brain{position:absolute;left:50%;margin-left:calc(var(--w-brain) / -2);top:0;bottom:0;width:var(--w-brain)}
.slot-form{position:absolute;left:0;right:0;top:var(--space-3);margin:0 auto;width:min(var(--w-form), calc(100% - var(--space-3) * 2))}
.slot-corner{position:absolute;right:var(--space-2);top:var(--space-1)}
.pg{position:absolute;top:var(--space-2)}
.pg.col-a{left:var(--space-3);width:calc(50% - var(--space-4))}
.pg.col-b{right:var(--space-3);width:calc(50% - var(--space-4))}
.pg.wide{left:var(--space-3);right:var(--space-3)}
.pg.col-side{left:var(--space-3);width:var(--w-side)}   /* not .pg.side: .side is the side panel, and would draw its background and edge here */
.pg.rest{left:calc(var(--space-3) * 2 + var(--w-side));right:var(--space-3)}
.pg.inset{left:var(--space-4);right:var(--space-4);top:var(--space-3)}
.at-corner{position:absolute;left:var(--space-1);bottom:var(--space-2);display:flex}
.w-tile{width:var(--w-tile)}.w-well{width:var(--w-well)}.w-sheet{width:720px}.w-sheet-wide{width:880px}.h-screen{height:var(--h-screen)}.h-stage{height:var(--h-stage)}.h-thumb{height:var(--h-thumb)}.h-well{height:var(--h-well)}

<style>
