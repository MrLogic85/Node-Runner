<style id="type-classes">.t-title{font:var(--t-title);letter-spacing:normal;text-transform:none}.t-heading{font:var(--t-heading);letter-spacing:normal;text-transform:none}.t-subheading{font:var(--t-subheading);letter-spacing:normal;text-transform:none}.t-stage{font:var(--t-stage);letter-spacing:0.06em;text-transform:uppercase}.t-body{font:var(--t-body);letter-spacing:normal;text-transform:none}.t-body-strong{font:var(--t-body-strong);letter-spacing:normal;text-transform:none}.t-small{font:var(--t-small);letter-spacing:normal;text-transform:none}.t-small-strong{font:var(--t-small-strong);letter-spacing:normal;text-transform:none}.t-label{font:var(--t-label);letter-spacing:0.04em;text-transform:uppercase}.t-note{font:var(--t-note);letter-spacing:normal;text-transform:none}.t-note-strong{font:var(--t-note-strong);letter-spacing:normal;text-transform:none}.t-caption{font:var(--t-caption);letter-spacing:normal;text-transform:none}.t-overline{font:var(--t-overline);letter-spacing:0.06em;text-transform:uppercase}.t-readout-lg{font:var(--t-readout-lg);letter-spacing:normal;text-transform:none}.t-readout{font:var(--t-readout);letter-spacing:normal;text-transform:none}.t-readout-md{font:var(--t-readout-md);letter-spacing:normal;text-transform:none}.t-readout-sm{font:var(--t-readout-sm);letter-spacing:normal;text-transform:none}</style>
<style id="layout-classes">
.slot-rail{position:absolute;left:0;top:0;bottom:0;width:var(--w-rail)}
.slot-arena{position:absolute;left:var(--w-rail);right:var(--w-side);top:0;bottom:0}
.slot-side{position:absolute;right:0;top:0;bottom:0;width:var(--w-side)}
.slot-tray{position:absolute;left:0;right:var(--w-side);bottom:0}
.slot-fill{position:absolute;left:0;right:0;top:0;bottom:0}
.slot-foot{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-1)}
.slot-brain{position:absolute;left:50%;margin-left:calc(var(--w-brain) / -2);top:0;bottom:0;width:var(--w-brain)}
.slot-corner{position:absolute;right:var(--space-2);top:var(--space-1)}
.pg{position:absolute;top:var(--space-2)}
.pg.col-a{left:var(--space-3);width:calc(50% - var(--space-4))}
.pg.col-b{right:var(--space-3);width:calc(50% - var(--space-4))}
.pg.wide{left:var(--space-3);right:var(--space-3)}
.pg.side{left:var(--space-3);width:var(--w-side)}
.pg.rest{left:calc(var(--space-3) * 2 + var(--w-side));right:var(--space-3)}
.pg.inset{left:var(--space-4);right:var(--space-4);top:var(--space-3)}
.at-corner{position:absolute;left:var(--space-1);bottom:var(--space-2)}
.w-tile{width:var(--w-tile)}.w-well{width:var(--w-well)}.w-sheet{width:var(--w-sheet)}.w-sheet-wide{width:var(--w-sheet-wide)}.h-screen{height:var(--h-screen)}.h-stage{height:var(--h-stage)}.h-thumb{height:var(--h-thumb)}
.inset-tl{position:absolute;left:var(--space-3);top:var(--space-3)}
.slot-at-side{position:absolute;right:0;top:0}
.at-badge{position:absolute;top:calc(var(--space-1) * -1);right:calc(var(--space-1) * -1)}
.w-card{width:var(--w-card)}.w-menu{width:var(--w-menu)}.w-dialog{width:var(--w-dialog)}.w-side{width:var(--w-side)}
.w-col-xs{width:var(--w-col-xs)}.w-col-sm{width:var(--w-col-sm)}.w-col-md{width:var(--w-col-md)}.w-col-lg{width:var(--w-col-lg)}.w-col-xl{width:var(--w-col-xl)}
.scrollbar{top:var(--space-2);bottom:var(--space-2);right:var(--space-1);height:auto}
</style>
<style id="surface-classes">
.btn,.field,.partrow,.seg,.chip{border:1px solid var(--line-strong);background:var(--panel-raised)}
.btn,.field,.partrow,.seg{border-radius:var(--radius-md)}
.pnl.pick{border-color:var(--halo);box-shadow:0 0 0 1px var(--halo)}
.pnl.menu{overflow:hidden;padding:0;box-shadow:0 0 12px var(--accent-glow)}
.pnl.dialog{padding:var(--space-4);box-shadow:0 0 16px var(--accent-glow)}
</style>
<style>/* one button: kind (default, primary, danger, flat) x layout (row, icon, stack) x state (on, off) */
.btn.flat{background:transparent;border-color:transparent}
.btn.icon{width:var(--control);height:var(--control);margin:var(--space-1);padding:0;flex:none;gap:0}
.btn.icon.sm{width:var(--control-sm);height:var(--control-sm);margin:0}
.btn.icon.lg{width:var(--touch);height:var(--touch);margin:0}
.btn.stack{width:var(--touch);height:var(--touch);min-height:0;padding:0;flex:none;flex-direction:column;gap:var(--space-1);font:var(--t-overline);letter-spacing:0.06em}
.btn.on{background:var(--accent-soft);border:2px solid var(--accent);box-shadow:var(--glow)}
.btn.off{opacity:.5;border-style:dashed}
</style>
