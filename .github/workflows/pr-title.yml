name: PR title

# Its own workflow, so a pull_request_target run does not report Build,
# Test & coverage and Format check as skipped, which the ruleset counts as
# passed.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  semantic-pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          headerPattern: '^(\w+)(?:\((#[1-9][0-9]*(?:, #[1-9][0-9]*)*)\))?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          requireScope: true
          scopes: |
            #[1-9][0-9]*
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            style
            revert
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            PR title must be `type(#123): Description` or
            `type(#123, #124): Description`, e.g.
            `ci(#15): Preserve CI test results`.
