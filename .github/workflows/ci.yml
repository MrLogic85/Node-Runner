name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  semantic-pr-title:
    name: PR title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          headerPattern: '^(\w+)(?:\((#[0-9]{4})\))?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          requireScope: true
          scopes: |
            #[0-9]{4}
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            style
            revert
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            PR title must be `type(#NNNN): Description`, e.g.
            `ci(#0014): Add semantic PR title check`.

  build:
    name: Build
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NodeRunner.slnx

      - name: Build
        run: dotnet build NodeRunner.slnx --configuration Release --no-restore

  test:
    name: Test & coverage
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NodeRunner.slnx

      - name: Test with coverage
        run: >
          dotnet test NodeRunner.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

  format:
    name: Format check
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NodeRunner.slnx

      - name: Verify formatting
        run: dotnet format NodeRunner.slnx --verify-no-changes --no-restore
